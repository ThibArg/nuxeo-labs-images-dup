# The Painless module of an OpenSearch distribution, for the embedded test node, which loads no module by itself.
# The jars are copied next to this file by the build (maven-dependency-plugin, see the pom), ASM excepted: it is
# already on the test classpath, and the jar hell check of the node refuses duplicated classes.
description=An easy, safe and fast scripting language for OpenSearch
version=${opensearch1.version}
name=lang-painless
classname=org.opensearch.painless.PainlessPlugin
java.version=1.8
opensearch.version=${opensearch1.version}
extended.plugins=
has.native.controller=false
